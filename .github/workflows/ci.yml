name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: make lint

      - name: Tests
        run: make test

      - name: README builds from template
        run: make clean && make && grep -q "lines\*\* of code" README.md
